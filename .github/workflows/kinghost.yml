name: Gerar pacote KingHost

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Instalar dependências com lockfile
        run: bun install --frozen-lockfile
      - name: Gerar e validar publicação estática
        run: bun run build:kinghost
      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v7
        with:
          name: frotas-experience-kinghost
          path: dist/kinghost/
          if-no-files-found: error
          retention-days: 30
